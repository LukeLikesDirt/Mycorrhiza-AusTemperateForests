# Name the environment
name: dyna_clust_env

# Tell Conda where to look for software that you want to install
channels:
  - conda-forge
  - bioconda
  - defaults
  - base
  - R

# Tell Conda the software that you want to install
dependencies:
  - r-base=4.3.3
  - r-essentials=4.3.1
  - r-biocmanager=1.30.24
  - r-devtools=2.4.5
  - r-seqinr=4.2_36
  - r-furrr=0.3.1
  - r-jsonlite=1.8.7
  - r-optparse=1.7.5
  - bioconductor-shortread=1.60.0
  - bioconductor-dada2=1.30.0
  - vsearch=2.30.3
  - itsxpress=2.1.4
  - itsxrust=0.2.2
  - ITSx=1.1.3
  - hmmer=3.4
  - seqkit=2.8.2
  - cutadapt=5.2
  - p7zip=16.02
  - wget=1.21.4

